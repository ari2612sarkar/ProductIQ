[project]
name = "product-intelligence"
version = "0.1.0"
description = "Autonomous Product Intelligence & Decision Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.3.0",
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "sqlglot>=24.0.0",
    "pgvector>=0.2.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.3.0",
    "faker>=24.0.0",
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-psycopg2>=2.0.0",
    "types-redis>=4.6.0",
    "types-requests>=2.31.0",
    "types-pyyaml>=6.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "analytics*", "api*", "db*", "config*", "evaluation*", "observability*", "scripts*"]
exclude = ["tests*", "docker*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PIE", "PT", "Q", "RUF", "PL", "TRY", "ARG", "PTH", "ERA", "PD", "PGH", "RET", "FLY", "NPY", "PERF", "TCH", "INT", "ASYNC", "LOG", "DJ"]
ignore = ["S101", "S106", "S311", "S603", "S607", "S608", "PLW0603"]
exclude = ["migrations", ".venv", "dist", "build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["agents", "analytics", "api", "db", "config"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]