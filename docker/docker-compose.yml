version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: product-intelligence-postgres
    environment:
      POSTGRES_DB: product_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - product-intelligence-network

  redis:
    image: redis:7-alpine
    container_name: product-intelligence-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - product-intelligence-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: product-intelligence-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    # No healthcheck needed - qdrant is verified working via HTTP
    networks:
      - product-intelligence-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: product-intelligence-api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/product_intelligence
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_DB_TYPE=qdrant
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - OTEL_ENDPOINT=http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - product-intelligence-network
    volumes:
      - ../config:/app/config:ro
      - ../scripts:/app/scripts:ro

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: product-intelligence-worker
    command: python -m scripts.background_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/product_intelligence
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_DB_TYPE=qdrant
      - APP_ENV=development
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - product-intelligence-network
    volumes:
      - ../config:/app/config:ro
      - ../scripts:/app/scripts:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.0
    container_name: product-intelligence-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # Prometheus metrics
    networks:
      - product-intelligence-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: product-intelligence-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - product-intelligence-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: product-intelligence-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - product-intelligence-network

networks:
  product-intelligence-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data: